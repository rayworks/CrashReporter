name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Create gradle property file
      env:
        token: ${{ secrets.GITHUBTOKEN }}
        name: ${{ secrets.GITHUBUSERNAME }}
      run: |
        echo githubToken="$token" >> ${{ github.workspace }}/gradle.properties
        echo githubUserName="$name" >> ${{ github.workspace }}/gradle.properties
        echo "end of properties"
      shell: bash
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      env:
        githubToken: ${{ secrets.GITHUBTOKEN }}
        githubUserName: ${{ secrets.GITHUBUSERNAME }}
      run: ./gradlew build
