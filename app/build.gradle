plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdk rootProject.ext.compile_sdk_version
    defaultConfig {
        applicationId "com.balsikandar.crashreporter.sample"
        minSdkVersion 21
        targetSdkVersion rootProject.ext.compile_sdk_version
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"
            }
        }
        ndk {
            version "28.2.13676358"
            //noinspection ChromeOsAbiSupport
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
    namespace("com.balsikandar.crashreporter.sample")

    buildFeatures {
        buildConfig true
    }
}

apply from: '../compile_options.gradle'

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.test.ext:junit:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })

    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation 'androidx.activity:activity:1.8.0'

    testImplementation 'junit:junit:4.13.2'
    api project(':crashreporter')
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
}
